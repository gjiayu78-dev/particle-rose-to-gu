name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build single EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "to_故辞安" --collect-all pygame main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: to-gu-cian-windows
          path: dist/to_故辞安.exe
          if-no-files-found: error
