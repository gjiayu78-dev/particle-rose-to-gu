name: Preview V7 High-Res Mesh

on:
  push:
    branches: [ v7-highres-rose-mesh ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch CC0 rose OBJ
        run: |
          mkdir -p public
          curl --fail --location --retry 3 --retry-delay 2 \
            https://happy358.github.io/Images/Model/red_rose3.obj \
            --output public/red_rose3.obj
          test -s public/red_rose3.obj
          wc -c public/red_rose3.obj

      - name: Build renderer
        run: npm run build:web

      - name: Check Xvfb
        run: |
          which Xvfb
          which xvfb-run

      - name: Capture real runtime at full bouquet state
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx electron . --no-sandbox --capture-preview

      - name: Verify preview
        run: |
          test -s preview/V7_ACTUAL_RUNTIME.png
          file preview/V7_ACTUAL_RUNTIME.png

      - name: Upload real runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: v7-actual-runtime-preview
          path: preview/V7_ACTUAL_RUNTIME.png
          if-no-files-found: error
          compression-level: 0
