name: Preview V8 Pink Particle Heart

on:
  push:
    branches: [ v8-pink-particle-heart ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build renderer
        run: npm run build:web

      - name: Capture actual Electron runtime
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'true'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npx electron . --no-sandbox --capture-preview

      - name: Verify preview
        run: |
          test -s preview/V8_HEART_RUNTIME.png
          file preview/V8_HEART_RUNTIME.png

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: v8-heart-runtime-preview
          path: preview/V8_HEART_RUNTIME.png
          if-no-files-found: error
          compression-level: 0
